<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d1419">
  <meta name="description" content="폐국을 앞둔 라디오 방송국. 같은 8분을 되감아 사라진 인터뷰를 찾으세요.">
  <title>마지막 방송까지 8분</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./style.css">
  <script defer src="./game.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="shell top-inner">
      <div class="brand"><span class="brand-mark" aria-hidden="true">▂▅▇▅▂</span><span>한려 FM<span class="frequency"> 89.7</span></span></div>
      <div class="top-actions">
        <button class="small-button" id="sound" type="button" aria-pressed="false">효과음 끔</button>
        <button class="small-button notebook-button" id="journal-open" type="button" aria-haspopup="dialog">단서 수첩 <span id="journal-count">0</span></button>
      </div>
    </div>
  </header>
  <main class="shell dashboard">
    <div class="main-column">
      <section class="hero" aria-labelledby="game-title">
        <div class="hero-image" aria-hidden="true"></div>
        <div class="hero-content">
          <span class="station-state" id="station-state"><span></span> 폐국까지</span>
          <h1 id="game-title">마지막 방송까지<br><em>8분</em></h1>
          <p>오늘 자정, 한려 FM의 마지막 방송이 끝난다.</p>
        </div>
      </section>
      <section class="room panel" aria-labelledby="room-name">
        <div class="room-head">
          <div>
            <span class="section-label">현재 위치</span>
            <h2 id="room-name">방송실</h2>
          </div>
          <span class="clock-readout" id="clock-readout">23:52</span>
        </div>
        <p id="room-description" class="room-description"></p>
        <p class="message" id="message" tabindex="-1" aria-live="polite" aria-atomic="true"></p>
        <div id="actions" class="action-grid" aria-label="할 수 있는 행동"></div>
      </section>
      <section class="map panel" id="map" aria-labelledby="map-title">
        <div class="panel-heading"><h2 id="map-title">방송국 지도</h2><span class="annotation">이동 +1분</span></div>
        <div class="places" id="places"></div>
      </section>
    </div>
    <aside class="sidebar" aria-label="진행 상황">
      <section class="timer panel" aria-labelledby="time-title">
        <div class="panel-heading"><h2 id="time-title">남은 시간</h2><span class="loop" id="loop"></span></div>
        <div class="timer-display" id="timer-display" aria-hidden="true">08<span>:</span>00</div>
        <div class="minute-track" id="minute-track" aria-label="남은 시간 8분"></div>
        <p>한 번 움직일 때마다 1분이 지나갑니다.</p>
      </section>
      <section class="journal-inline panel" aria-labelledby="journal-title">
        <div class="panel-heading"><h2 id="journal-title">단서 수첩</h2><span id="clue-count" class="score">0 / 6</span></div>
        <ul id="clue-list" class="clue-list"></ul>
        <p class="annotation">시간을 되감아도 발견한 단서는 남습니다.</p>
      </section>
      <section class="endings panel" aria-labelledby="ending-title">
        <div class="panel-heading"><h2 id="ending-title">결말 기록</h2><span id="ending-count" class="score">0 / 3</span></div>
        <ul id="ending-list"></ul>
      </section>
      <button class="rewind" id="rewind" type="button">↶ 8분 전으로 되감기</button>
    </aside>
  </main>
  <dialog id="journal-dialog" aria-labelledby="dialog-title">
    <div class="panel-heading"><h2 id="dialog-title">단서 수첩</h2><button type="button" class="small-button" id="journal-close">닫기</button></div>
    <ul id="dialog-clues" class="clue-list"></ul>
    <p class="annotation">수첩을 읽는 동안 시간은 그대로입니다.</p>
  </dialog>
</body>
</html>
